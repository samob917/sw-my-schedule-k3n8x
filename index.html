<title>My schedule — sign in</title>
<style>
 html{-webkit-text-size-adjust:100%}
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
   background:#0E1621;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
   padding:20px;box-sizing:border-box}
 .card{width:350px;max-width:100%;box-sizing:border-box;text-align:center}
 .logo{font-size:30px}
 h1{font-size:20px;color:#E8EEF4;margin:12px 0 3px;letter-spacing:-.02em}
 .sub{font-size:13px;color:#8AA0B4;margin-bottom:26px}
 label.l{display:block;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
   font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8AA0B4;font-weight:600;margin-bottom:7px}
 input{width:100%;box-sizing:border-box;padding:14px;font-size:16px;background:#16212E;color:#E8EEF4;
   border:1.5px solid #24374A;border-radius:12px;outline:none;text-align:center;
   font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}
 input:focus{border-color:#35D6A4}
 button{width:100%;margin-top:11px;padding:14px;font-size:15px;font-weight:800;color:#06231A;
   background:#35D6A4;border:0;border-radius:12px;cursor:pointer}
 button:disabled{opacity:.55}
 .rem{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:15px;font-size:12.5px;color:#8AA0B4}
 .err{color:#FF6B6B;font-size:13px;min-height:18px;margin-top:11px;font-weight:600}
 .note{font-size:11.5px;color:#5C7285;margin-top:20px;line-height:1.6}

<div class="card">
 <div class="logo">⚡</div>
 <h1>My schedule</h1>
 <div class="sub">CCPSA Critical Care</div>

          autocorrect="off" spellcheck="false" autofocus>
   <button id="go">Sign in</button>
   <label class="rem"><input type="checkbox" id="rem" checked style="width:auto;padding:0"> Keep me signed in</label>
   <div class="err" id="err"></div>
 </form>

<script>
// Browsers expose crypto.subtle only in a SECURE CONTEXT (https or localhost). Served over
// plain http the whole unlock path is undefined, so the password silently did nothing --
// which reads as "wrong password" to the user. Say so, and offer the https URL.
if(!window.isSecureContext||!(window.crypto&&crypto.subtle)){
  var h=location.host,p=location.pathname;
  document.querySelector('.card').innerHTML=
    '<div class="logo">&#128274;</div><h1>Use the secure link</h1>'+
    '<div class="sub">This page decrypts in your browser, which only works over <b>https</b>.</div>'+
    '<p style="margin:18px 0"><a style="color:#9ec7f5;font-size:15px" href="https://'+h+p+'">'+
    'https://'+h+p+'</a></p>'+
    '<div class="note">If that link is not ready yet, the certificate for this domain is still '+
    'being issued &mdash; it usually takes a few minutes. Nothing is wrong with your password.</div>';
}
</script>

var te=new TextEncoder(),td=new TextDecoder();
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function hex(buf){return [...new Uint8Array(buf).slice(0,8)].map(b=>b.toString(16).padStart(2,'0')).join('');}
function dec(keyBytes,pack){
  return crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(pack.i||pack.iv)},k,u8(pack.c||pack.ct));});
}
function launch(slot){
  try{
    sessionStorage.setItem('__acct',JSON.stringify({person:slot.person,role:slot.role,label:slot.label}));
  }catch(e){}
  var jobs=[dec(u8(slot.ka),A)];
  if(slot.kb&&B)jobs.push(dec(u8(slot.kb),B));
  return Promise.all(jobs).then(function(res){
    if(res[1]){try{sessionStorage.setItem('__admin',td.decode(res[1]));}catch(e){}}
    var html=td.decode(res[0]);
    document.open();document.write(html);document.close();
  });
}
function signIn(code,remember){
  var prefix=(code.split('-')[0]||'').toLowerCase().trim();
  return crypto.subtle.digest('SHA-256',te.encode(prefix)).then(function(h){
    var slotPack=IDX[hex(h)];
    if(!slotPack)throw new Error('no account');
    return crypto.subtle.importKey('raw',te.encode(code.trim()),'PBKDF2',false,['deriveBits'])
      .then(function(km){return crypto.subtle.deriveBits(
        {name:'PBKDF2',salt:u8(slotPack.s),iterations:ITER,hash:'SHA-256'},km,256);})
      .then(function(bits){return dec(new Uint8Array(bits),slotPack);})
      .then(function(pt){
        var slot=JSON.parse(td.decode(pt));
        if(remember){try{localStorage.setItem('__code',code.trim());}catch(e){}}
        else{try{localStorage.removeItem('__code');}catch(e){}}
        return launch(slot);
      });
  });
}
